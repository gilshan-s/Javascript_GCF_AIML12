<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //1. break statement
        for(var i=1; i<=5; i++){
            if(i==3){
                break; // exit loop when i is 3
            }
            console.log(i); // prints 1, 2
            document.write(i + "<br>"); // prints 1, 2
        }
        //2. continue statement
        for(var j=1; j<=5; j++){
            if(j%2!=1){
                continue; // skip the rest of the loop when j is even
            }
            console.log(j); // prints 1, 3, 5
            document.write(j + "<br>"); // prints 1, 3, 5
        }
    </script>
</body>
</html>
