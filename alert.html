<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Dialog boxes in JS</h1>
    <script>
        // alert("Hello, World!")
        // alert("Welcome Rajesh")
        // window.alert("1")
        // alert("2")
        // alert("3")

        var yashash=window.prompt("What is dialog box in JS?")
        alert("Dialog boxes are of 3 types in JS: alert, prompt and confirm",yashash)
        document.write("<h1>Hello dont forget yashash</h1>")

        var rajesh=window.confirm("Do you want to continue?")
        
        if(rajesh){
            document.write("You clicked OK")
        }
        else{
            document.write("You clicked Cancel")
        }
    </script>
</body>
</html>
